<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hide by ID</title>
    <style>
      body {
        font-family: sans-serif;
        min-width: 260px;
        margin: 10px;
      }

      h1 {
        font-size: 16px;
        margin-bottom: 8px;
      }

      form {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }

      input[type="text"] {
        flex: 1;
        padding: 4px 6px;
        font-size: 12px;
      }

      button {
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
      }

      #clearBtn {
        width: 100%;
        margin-bottom: 6px;
        margin-top: -4px;
        padding: 6px;
        font-size: 12px;
        border: 1px solid #d00;
        background: #ffeded;
        color: #a00;
        cursor: pointer;
      }

      #loadSwaggerBtn {
        width: 100%;
        margin-bottom: 10px;
        padding: 6px;
        font-size: 12px;
        border: 1px solid #007acc;
        background: #e7f3ff;
        color: #005a9e;
        cursor: pointer;
      }

      #idList {
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 180px;
        overflow-y: auto;
      }

      #idList li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 4px;
        padding: 2px 4px;
        border: 1px solid #ddd;
        border-radius: 3px;
      }

      .id-text {
        word-break: break-all;
        margin-right: 8px;
      }

      .remove-btn {
        border: none;
        background: #eee;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        font-size: 11px;
        line-height: 16px;
        text-align: center;
        cursor: pointer;
      }

      .empty {
        font-size: 12px;
        color: #999;
      }
    </style>
  </head>
  <body>
    <h1>Hide Parent by Element ID</h1>

    <form id="addForm">
      <input type="text" id="idInput" placeholder="Enter element ID" />
      <button type="submit">Add</button>
    </form>

    <button id="clearBtn">Clear List</button>
    <button id="loadSwaggerBtn">Load all Swagger rows</button>

    <ul id="idList"></ul>
    <p id="emptyState" class="empty">No IDs yet. Add one above.</p>

    <script src="popup.js"></script>
  </body>
</html>
